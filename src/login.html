<!doctype html>
<!-- Form login publik; pemeriksaan sesi dan submit ditangani login.js. -->
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1565c0">
  <title>Masuk - Kasir Bisa</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="icon/Favicon.png">
</head>
<body class="halaman-login">
  <main class="login-layout">
    <section class="login-card" aria-labelledby="login-title">
      <a class="brand login-brand" href="login.html" aria-label="Kasir Bisa">
        <img class="brand-logo" src="icon/Favicon.png" alt="" aria-hidden="true">
        <span><strong>Kasir Bisa</strong><small>Kasir kantin sederhana</small></span>
      </a>
      <p class="eyebrow">SELAMAT DATANG</p>
      <h1 id="login-title">Masuk ke Kasir Bisa</h1>
      <p class="login-description">Masukkan nama pengguna atau nama usaha yang Anda daftarkan, lalu kata sandi.</p>
      <form id="form-login">
        <label for="nama-pengguna">Nama pengguna atau nama usaha</label>
        <input id="nama-pengguna" name="username" type="text" autocomplete="username" required maxlength="128">
        <label for="kata-sandi">Kata sandi</label>
        <div class="password-field">
          <input id="kata-sandi" name="password" type="password" autocomplete="current-password" required maxlength="256">
          <button id="lihat-kata-sandi" type="button" aria-label="Tampilkan password">Lihat</button>
        </div>
        <a class="login-whatsapp-link" href="login-whatsapp.html">Lupa kata sandi? Masuk dengan kode WhatsApp</a>
        <button id="tombol-login" class="primary-button" type="submit">Masuk</button>
      </form>
      <p id="pesan-login" class="login-message" role="status" aria-live="polite"></p>
      <p class="login-help">Belum punya akun? <a href="signup.html">Daftar usaha</a></p>
      <p class="login-help login-guide-link">Perlu bantuan? <a href="cara-masuk.html">Baca panduan masuk dan pendaftaran</a>.</p>
    </section>
  </main>
  <script src="scripts/login.js"></script>
</body>
</html>
