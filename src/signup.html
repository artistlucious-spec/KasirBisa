<!doctype html>
<!-- Form pendaftaran usaha; validasi server tetap dilakukan pada worker.js. -->
<html lang="id">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1565c0">
  <title>Daftar - Kasir Bisa</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="icon/Favicon.png">
  <meta name="google-site-verification" content="NO5RR-pr0YoE4Nm9SYrE1QWnfaNdxSnaZm7iL7YOrng" />
</head>
<body class="halaman-login">
  <main class="login-layout">
    <section class="login-card" aria-labelledby="signup-title">
      <a class="brand login-brand" href="login.html" aria-label="Kasir Bisa">
        <img class="brand-logo" src="icon/Favicon.png" alt="" aria-hidden="true">
        <span><strong>Kasir Bisa</strong><small>Kasir kantin sederhana</small></span>
      </a>
      <p class="eyebrow">MULAI MENGELOLA USAHA</p>
      <h1 id="signup-title">Buat akun usaha</h1>
      <p class="login-description">Setiap usaha mendapatkan ruang data yang terpisah.</p>
      <form id="form-signup">
        <label for="nama-usaha">Nama usaha</label>
        <input id="nama-usaha" name="businessName" type="text" autocomplete="organization" required maxlength="120">
        <small class="login-field-help">Nama ini juga bisa dipakai saat masuk.</small>
        <label for="nama-pengguna">Nama pengguna</label>
        <input id="nama-pengguna" name="username" type="text" autocomplete="username" required maxlength="128">
        <label for="nomor-whatsapp">Nomor WhatsApp</label>
        <input id="nomor-whatsapp" name="whatsapp" type="tel" inputmode="tel" autocomplete="tel" required maxlength="24" placeholder="Contoh: 081234567890">
        <small class="login-field-help">Nomor ini bisa dipakai untuk menerima kode masuk jika Anda lupa kata sandi.</small>
        <label for="kata-sandi">Kata sandi (4–12 karakter)</label>
        <input id="kata-sandi" name="password" type="password" autocomplete="new-password" required minlength="4" maxlength="12">
        <label for="konfirmasi-kata-sandi">Ulangi kata sandi</label>
        <input id="konfirmasi-kata-sandi" name="confirmPassword" type="password" autocomplete="new-password" required minlength="4" maxlength="12">
        <button id="tombol-daftar" class="primary-button" type="submit">Daftar dan mulai</button>
      </form>
      <p id="pesan-daftar" class="login-message" role="status" aria-live="polite"></p>
      <p class="login-help">Sudah punya akun? <a href="login.html">Masuk</a></p>
    </section>
  </main>
  <script src="scripts/signup.js"></script>
</body>
</html>
