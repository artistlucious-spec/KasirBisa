<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rekap Transaksi - Kasir Bisa</title>
  <script src="scripts/auth-guard.js"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/png" href="icon/Favicon.png">
</head>
<body class="halaman-rekap">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Kasir Bisa, kembali ke kasir">
      <span class="brand-mark" aria-hidden="true">KB</span>
      <span><strong>Kasir Bisa</strong><small>Kasir kantin sederhana</small></span>
    </a>
    <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Buka menu" aria-controls="site-menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav id="site-menu" class="header-nav" aria-label="Navigasi utama" hidden>
      <a class="header-link" href="index.html">Kasir</a>
      <a class="header-link active" href="rekap.html">Rekap</a>
      <a class="header-link" href="smart-insight.html">Smart Insight</a>
      <a class="header-link" href="panduan.html">Panduan</a>
      <a class="header-link" href="profile.html">Profil</a>
      <button id="tombol-keluar" class="header-link logout-button" type="button">Keluar</button>
    </nav>
  </header>
  <main>
    <section class="rekap">
      <p><a href="index.html">Kembali ke kasir</a></p>
      <h2>Transaksi Berhasil</h2>
      <div class="filter-rekap">
        <label for="cari-transaksi">
          Cari transaksi
          <input id="cari-transaksi" type="search" placeholder="Cari produk, waktu, atau nominal">
        </label>
        <label for="filter-produk">
          Filter produk
          <select id="filter-produk">
            <option value="">Semua produk</option>
          </select>
        </label>
        <button type="button" id="reset-filter">Hapus filter</button>
        <button type="button" id="unduh-csv">Unduh CSV</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Waktu</th>
            <th>Produk</th>
            <th class="angka">Subtotal</th>
            <th class="angka">Diskon</th>
            <th class="angka">PPN</th>
            <th class="angka">Total</th>
            <th class="angka">Dibayar</th>
            <th class="angka">Kembalian</th>
          </tr>
        </thead>
        <tbody id="rekap-transaksi"></tbody>
      </table>
    </section>
  </main>
  <script src="scripts/navigation.js"></script>
  <script src="scripts/rekap.js"></script>

</body>
</html>
